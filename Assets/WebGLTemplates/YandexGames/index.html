<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- Yandex Games SDK. Yandex serves it at this relative path for games uploaded through the Developer Console
         (and @yandex-games/sdk-dev-proxy does locally). On any other host the request fails and the game runs with
         fallback services. -->
    <script src="/sdk.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: {{{ BACKGROUND_COLOR }}};
      }

      /* No text selection, long-tap menu, tap highlight, zoom or pull-to-refresh in the game (Yandex 1.6, 1.10). */
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }

      /* The canvas fills the frame Yandex gives the game (Yandex 1.6). */
      #unity-canvas {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}};
      }

      /* Download progress until the bootstrap scene's own loading screen takes over. */
      #unity-loading {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 40%;
        max-width: 320px;
        height: 6px;
        transform: translate(-50%, -50%);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      #unity-loading-fill {
        width: 0;
        height: 100%;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading"><div id="unity-loading-fill"></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector('#unity-canvas');
      var loading = document.querySelector('#unity-loading');
      var loadingFill = document.querySelector('#unity-loading-fill');

      // No context menu inside the game (Yandex 1.6).
      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      // The game runs in an iframe on Yandex: take keyboard focus when the player touches it.
      canvas.addEventListener('pointerdown', function () {
        window.focus();
        canvas.focus();
      });

      var config = {
        arguments: [],
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
        workerUrl: 'Build/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
        memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Unity's warnings and errors go to the console, not over the game.
        showBanner: function (message, type) {
          if (type === 'error') {
            console.error(message);
          } else {
            console.warn(message);
          }
        }
      };

      createUnityInstance(canvas, config, function (progress) {
        loadingFill.style.width = (100 * progress) + '%';
      }).then(function () {
        loading.style.display = 'none';
      }).catch(function (message) {
        console.error(message);
        alert(message);
      });
    </script>
  </body>
</html>
